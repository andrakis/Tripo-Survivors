<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>TRIPO SURVIVORS</title>
  <style>
    /* No web fonts: partly load time, partly because font-loading is exactly what hangs
       page.screenshot() in the headless verification path (docs/ART-STYLE.md). */
    html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #2a2f38;
      color: #e8ecf2;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      /* the game is drag-to-move on touch; never let the page pan or bounce underneath it */
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
