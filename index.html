<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>TRIPO SURVIVORS</title>
  <!-- Inline, so there is no favicon request to 404 in the console. A stray 404 is noise the
       headless checks have to special-case, and noise a viewer following the tutorial will
       reasonably assume is their model failing to load. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232a2f38'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ffe9a8'/%3E%3C/svg%3E" />
  <style>
    /* No web fonts: partly load time, partly because font-loading is exactly what hangs
       page.screenshot() in the headless verification path (docs/ART-STYLE.md). */
    html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #2a2f38;
      color: #e8ecf2;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      /* the game is drag-to-move on touch; never let the page pan or bounce underneath it */
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; }

    /* Shown while the GLBs named in src/models/registry.ts load, and removed by main.tsx before
       the first render. Inline rather than a React component because it has to be on screen
       BEFORE any JavaScript module has finished evaluating — which is the only window it is for. */
    #boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #2a2f38;
      color: #8fa0b8;
      font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 3px;
    }
    #boot span { animation: boot-pulse 1.1s ease-in-out infinite; }
    @keyframes boot-pulse { 0%, 100% { opacity: 0.45 } 50% { opacity: 1 } }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot"><span>LOADING MODELS</span></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
